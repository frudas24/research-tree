name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Format check
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || { printf 'Unformatted Go files:\n%s\n' "$unformatted"; exit 1; }

      - name: Module hygiene
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -timeout 120s ./...

      - name: Race detector
        run: go test -race -count=1 -timeout 180s ./...

      - name: Comment lint
        run: go run ./third_party/commentlint ./...

      - name: Build
        run: go build -o build/rt ./cmd/rt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0
          args: --timeout 5m

  windows-test:
    name: Windows BIN concurrency
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Add MinGW to PATH
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Test core
        run: go test -count=1 -timeout 180s ./pkg/retree

      - name: Race detector
        run: go test -race -count=1 -timeout 240s ./pkg/retree
        env:
          CGO_ENABLED: '1'

      - name: Stress lock-free BIN publication
        run: go test -race -count=10 -timeout 240s ./pkg/retree -run 'TestConcurrentBinaryReadersObserveCompleteGenerations|TestBinaryWriterReplacesFilesHeldByReaders'
        env:
          CGO_ENABLED: '1'
